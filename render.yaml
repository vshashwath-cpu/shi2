services:
  - type: web
    name: geoai-cadastre-workstation
    runtime: python
    buildCommand: pip install -r requirements.txt && python backend/dataset_generator.py && python backend/geoai/generate_samples.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
